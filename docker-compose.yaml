services:
  my-portfolio-v2:
    # Built on the host from the Dockerfile in this dir — no registry.
    # Roll back with: git reset --hard <sha> && docker compose up -d --build
    build:
      context: .
    image: portfolio-v2:latest
    container_name: my-portfolio-v2
    restart: unless-stopped
    # Host port 80 is already bound by another service on this box, so it's
    # published on 8081 instead. Whatever fronts v2.zararsharique.com (host
    # nginx, the `portfolio` compose project's proxy, etc.) should reverse-proxy
    # to 127.0.0.1:8081. The image still serves the built site on :80 internally
    # from its baked nginx.conf.
    ports:
      - "8081:80"
    networks:
      - web

networks:
  # The default network of the existing `portfolio` compose project on the host
  # (verify with `docker network ls`). Joining it lets portfolio-nginx-1 resolve
  # `my-portfolio-v2` by name.
  web:
    external: true
    name: portfolio_default
