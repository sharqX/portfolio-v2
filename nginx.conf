# In-image default. On the EC2 host this file is replaced by the DEFAULT_CONF
# secret mounted at the same path — see deploy/default.conf.example.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/rss+xml
    application/xml
    image/svg+xml;

  # Hashed build output — the filename changes whenever the bytes do.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Fonts are also content-hashed by the build.
  location ~* \.(woff2|woff|ttf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # HTML keeps its URL across deploys, so it has to revalidate or a release
  # stays invisible to anyone with a warm cache.
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/ $uri.html $uri/index.html =404;
  }

  location = /rss.xml {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }
}
